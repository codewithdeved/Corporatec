      <stop offset="0%" stop-color="#E2B857" />
      <stop offset="50%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#8F6B12" />
    </linearGradient>
    <radialGradient id="navyCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#11253E" />
      <stop offset="100%" stop-color="#071220" />
    </radialGradient>
  </defs>
  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="92" stroke="url(#goldRim)" stroke-width="4" fill="url(#navyCenter)" />
  <circle cx="100" cy="100" r="82" stroke="rgba(226, 184, 87, 0.4)" stroke-width="1.5" stroke-dasharray="4 3" fill="none" />
  
