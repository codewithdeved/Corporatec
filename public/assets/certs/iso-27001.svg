  <text x="100" y="140" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#E2B857" text-anchor="middle" letter-spacing="1.5">INFORMATION SECURITY</text>
  <text x="100" y="156" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="2">MANAGEMENT SYSTEM</text>
  <text x="100" y="172" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" fill="#64748B" text-anchor="middle">CERTIFIED AUDITED</text>
</svg>
